name: chit_chat
description: "A new Flutter project."
publish_to: 'none'
version: 1.1.2

environment:
  sdk: ^3.5.1

dependencies:
  animated_theme_switcher: ^2.0.10
  animated_toggle_switch: ^0.8.3
  animations: ^2.0.11
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.4.1
  connectivity_plus: ^7.1.1
  dio: ^5.7.0
  firebase_auth: ^6.5.1
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2
  firebase_storage: ^13.4.1
  flutter:
    sdk: flutter
  # flutter_app_badger: ^1.5.0 
  # flutter_app_icon_badge: ^2.0.0
  # flutter_app_badge_control: ^0.0.2
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.4.1
  # flutter_dynamic_icon: ^2.1.0
  flutter_local_notifications: ^21.0.0
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  googleapis_auth: ^2.3.1
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  lottie: ^3.1.2
  open_filex: ^4.7.0
  package_info_plus: ^10.1.0
  photo_view: ^0.15.0
  popover: ^0.4.0
  share_plus: ^13.1.0
  shared_preferences: ^2.3.2
  timer_count_down: ^2.2.2
  video_player: ^2.9.1
  video_thumbnail: ^0.5.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: 
  flutter_launcher_icons: 
  change_package_name: ^1.1.1

flutter_native_splash:
  web: false
  image: assets/icon/splash_icon.png
  color: "#d6e2ea"
  android: true

  android_12:
    image: assets/icon/splash_icon.png
    color: "#d6e2ea"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
 

flutter:
 uses-material-design: true
 assets:
    - assets/
    - assets/images/
    - assets/rivfiles/
    - assets/svg/
    - assets/lottie/

 fonts:
    - family: "Roboto-Regular"
      fonts:
        - asset: fonts/Roboto/Roboto-Regular.ttf
        
    - family: "Roboto-Bold"
      fonts:
        - asset: fonts/Roboto/Roboto-Bold.ttf

    - family: "Roboto-Medium"
      fonts:
        - asset: fonts/Roboto/Roboto-Medium.ttf
